# Round-robin across every `app` replica. Using a variable makes nginx resolve
# the service name at request time through Docker's DNS (all replica IPs),
# so scaled/restarted replicas are picked up without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $app_upstream app;
        proxy_pass http://$app_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 30s;
    }
}
